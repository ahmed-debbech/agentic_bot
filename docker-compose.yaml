services:
  agentic:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic
    restart: unless-stopped

    ports:
      - "9011:9011"

    volumes:
      - ./conv:/conv
      - ./prompts:/prompts
      - ./src/main/resources/application.properties:/app/src/main/resources/application.properties
